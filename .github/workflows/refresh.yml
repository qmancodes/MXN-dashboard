name: Refresh dashboard data

on:
  schedule:
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Update verification
        run: python scripts/verify_sample.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data logs VERIFICATION.md README.md
          git commit -m "data refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git push

      - name: Fail on partial failure
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("docs/data/metadata.json"))
          if m.get("status") == "partial_failure":
              sys.exit("partial_failure: see logs/refresh_log.csv")
          EOF
