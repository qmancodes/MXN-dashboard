# Every source series used by the dashboard.
# IDs verified against the official catalogs on 2026-11-24 (see README "Series verification").
#
# Fields
#   key            short name; also the CSV file name in docs/data/<key>.csv
#   id             series ID at the source
#   source         banxico | inegi | fred
#   name           human-readable name
#   source_url     page where a person can see the series on the source website
#   units          units of the raw value
#   frequency      daily | business-daily | monthly | quarterly | auction (irregular, ~every 4 weeks)
#   seasonal_adjustment
#   transformation formula(s) applied in scripts/fetch_data.py (raw value is always kept as `value`)
#   title_must_contain  (Banxico only) substring the series title returned by the SIE API must contain;
#                       guards against a silently changed ID
#   sanity         rule checked and logged on every run

settings:
  fetch_start: "2014-01-01"     # one extra year so y/y and moving averages exist from Jan 2015
  display_start: "2015-01-01"   # sample shown on the dashboard
  verification_date: "2024-01-01"  # fixed older observation used by verify_sample.py

series:
  # ---------------- Banxico SIE ----------------
  - key: fix
    id: SF43718
    source: banxico
    name: "FIX exchange rate, MXN per USD (date of determination)"
    source_url: "https://www.banxico.org.mx/tipcamb/tipCamMIAction.do?idioma=sp"
    units: "MXN per 1 USD"
    frequency: business-daily
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "ma20 = mean of the last 20 business-day observations"
    title_must_contain: "FIX"
    sanity: {type: range, min: 10, max: 30, column: value}

  - key: banxico_target
    id: SF61745
    source: banxico
    name: "Banxico target for the overnight interbank interest rate"
    source_url: "https://www.banxico.org.mx/publicaciones-y-prensa/anuncios-de-las-decisiones-de-politica-monetaria/anuncios-politica-monetaria-t.html"
    units: "% per year"
    frequency: daily
    seasonal_adjustment: "Not applicable"
    transformation: "decision = 1 on the first day a new target level is in force (value_t != value_{t-1})"
    title_must_contain: "objetivo"
    sanity: {type: multiple_of, step: 0.25, column: value}

  - key: mbono10
    id: SF44071
    source: banxico
    name: "10-year fixed-rate Bono M, weighted yield at primary auction"
    source_url: "https://www.banxico.org.mx/SieInternet/consultarDirectorioInternetAction.do?sector=18&accion=consultarCuadro&idCuadro=CF107&locale=es"
    units: "% per year"
    frequency: auction
    seasonal_adjustment: "Not applicable"
    transformation: "none (auction-date observations); monthly mean of auctions in yields_monthly.csv"
    title_must_contain: "10 a"
    sanity: {type: range, min: 0, max: 20, column: value}

  - key: rer_banxico
    id: SR1504
    source: banxico
    name: "Banxico bilateral real exchange rate index vs the US (consumer prices)"
    source_url: "https://www.banxico.org.mx/SieInternet/consultarDirectorioInternetAction.do?sector=2&accion=consultarCuadro&idCuadro=CR183&locale=es"
    units: "Index (Banxico base; increase = real depreciation of the peso)"
    frequency: monthly
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "rebased_avg = 100 × value_t / mean(value over the dashboard sample, Jan 2015 to latest)"
    title_must_contain: "real"
    sanity: {type: range, min: 30, max: 300, column: rebased_avg}

  # ---------------- INEGI BIE ----------------
  - key: gdp
    id: "736181"
    source: inegi
    name: "Real GDP, millions of 2018 pesos, seasonally adjusted"
    source_url: "https://www.inegi.org.mx/app/indicadores/?tm=0&ind=736181"
    units: "Millions of pesos at 2018 prices"
    frequency: quarterly
    seasonal_adjustment: "Seasonally adjusted (INEGI)"
    transformation: "yoy = 100 × (GDP_t / GDP_{t-4} − 1); qoq = 100 × (GDP_t / GDP_{t-1} − 1), not annualized"
    sanity: {type: range, min: -25, max: 25, column: yoy}

  - key: igae
    id: "737219"
    source: inegi
    name: "IGAE (monthly economic activity index), seasonally adjusted, 2018=100"
    source_url: "https://www.inegi.org.mx/app/indicadores/?tm=0&ind=737219"
    units: "Index 2018=100"
    frequency: monthly
    seasonal_adjustment: "Seasonally adjusted (INEGI)"
    transformation: "yoy = 100 × (IGAE_t / IGAE_{t-12} − 1)"
    sanity: {type: range, min: -30, max: 30, column: yoy}

  - key: inpc
    id: "910392"
    source: inegi
    name: "INPC headline index (base 2nd half of July 2018 = 100; 2024 basket update)"
    source_url: "https://www.inegi.org.mx/app/indicadores/?tm=0&ind=910392"
    units: "Index, 2Q July 2018 = 100"
    frequency: monthly
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "yoy = 100 × (INPC_t / INPC_{t-12} − 1)"
    sanity: {type: range, min: -5, max: 30, column: yoy}

  - key: inpc_core
    id: "910393"
    source: inegi
    name: "INPC core (subyacente) index (base 2nd half of July 2018 = 100; 2024 basket update)"
    source_url: "https://www.inegi.org.mx/app/indicadores/?tm=0&ind=910393"
    units: "Index, 2Q July 2018 = 100"
    frequency: monthly
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "yoy = 100 × (core_t / core_{t-12} − 1)"
    sanity: {type: range, min: -5, max: 30, column: yoy}

  - key: unemployment
    id: "444884"
    source: inegi
    name: "Unemployment rate (ENOE monthly, national, 15+), seasonally adjusted"
    source_url: "https://www.inegi.org.mx/app/indicadores/?tm=0&ind=444884"
    units: "% of the economically active population"
    frequency: monthly
    seasonal_adjustment: "Seasonally adjusted (INEGI)"
    transformation: "none; Apr–Jun 2020 forced to missing (ETOE telephone survey replaced ENOE), never interpolated"
    gap_months: ["2020-04-01", "2020-05-01", "2020-06-01"]
    sanity: {type: range, min: 0, max: 15, column: value}

  # ---------------- FRED ----------------
  - key: dff
    id: DFF
    source: fred
    name: "Effective federal funds rate"
    source_url: "https://fred.stlouisfed.org/series/DFF"
    units: "% per year"
    frequency: daily
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "none"
    sanity: {type: range, min: 0, max: 20, column: value}

  - key: fed_lower
    id: DFEDTARL
    source: fred
    name: "Federal funds target range, lower limit"
    source_url: "https://fred.stlouisfed.org/series/DFEDTARL"
    units: "% per year"
    frequency: daily
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "none"
    sanity: {type: multiple_of, step: 0.25, column: value}

  - key: fed_upper
    id: DFEDTARU
    source: fred
    name: "Federal funds target range, upper limit"
    source_url: "https://fred.stlouisfed.org/series/DFEDTARU"
    units: "% per year"
    frequency: daily
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "none"
    sanity: {type: multiple_of, step: 0.25, column: value}

  - key: cpi_us
    id: CPIAUCSL
    source: fred
    name: "US CPI, all urban consumers, all items, SA"
    source_url: "https://fred.stlouisfed.org/series/CPIAUCSL"
    units: "Index 1982–84 = 100"
    frequency: monthly
    seasonal_adjustment: "Seasonally adjusted (BLS)"
    transformation: "none (input to the real exchange rate)"
    sanity: {type: range, min: 100, max: 1000, column: value}

  - key: ust10
    id: DGS10
    source: fred
    name: "US 10-year Treasury constant maturity yield"
    source_url: "https://fred.stlouisfed.org/series/DGS10"
    units: "% per year"
    frequency: business-daily
    seasonal_adjustment: "Not seasonally adjusted"
    transformation: "monthly mean of daily values in yields_monthly.csv"
    sanity: {type: range, min: 0, max: 20, column: value}

# Series computed from the ones above (written to docs/data/<key>.csv)
derived:
  - key: policy_spread
    name: "Policy rate spread: Banxico target − Fed target upper limit"
    units: "percentage points"
    frequency: daily
    inputs: [banxico_target, fed_upper]
    transformation: "spread_t = banxico_target_t − fed_upper_t (both carried forward on calendar days; stops at the earlier of the two latest dates)"

  - key: rer
    name: "Real exchange rate MXN vs USD (own calculation and Banxico), sample average = 100"
    units: "Index, average of the sample since Jan 2015 = 100 (up = real peso depreciation)"
    frequency: monthly
    inputs: [fix, cpi_us, inpc, rer_banxico]
    transformation: "RER_t = S_t × CPI_US_t / INPC_t, S_t = monthly mean of FIX; rebased: 100 × RER_t / mean(RER over the dashboard sample, Jan 2015 to latest)"

  - key: yields
    name: "10-year yields: Bono M auction vs US Treasury, and spread"
    units: "% per year; spread in percentage points"
    frequency: auction
    inputs: [mbono10, ust10]
    transformation: "spread = Bono M 10y auction yield_t − DGS10 on the auction date (or the last earlier US business day)"

  - key: yields_monthly
    name: "10-year yields, monthly averages"
    units: "% per year; spread in percentage points"
    frequency: monthly
    inputs: [mbono10, ust10]
    transformation: "monthly mean of auction yields (Bono M) and of daily DGS10; spread = difference of the monthly means (months with an auction only)"
